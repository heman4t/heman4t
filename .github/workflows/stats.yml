name: Refresh profile stats

# Hosted stat widgets only see public repositories. This job rebuilds
# assets/contributions-*.svg from the contribution calendar, which counts
# private contributions too (counts only, never repository names).
# Needs a repository secret METRICS_TOKEN: a classic token with `read:user`
# (fine-grained tokens cannot read private contribution counts).

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild cards
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/gen_stats.py
      - name: Commit if changed
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-*.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution stats"
          git push
